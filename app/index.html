<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bham Irish Sessions — Setlist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="meta">
      <label>Date <input type="date" id="session-date"></label>
      <label>Venue <input type="text" id="session-venue" placeholder="Venue"></label>
      <span class="sets-tally"><b id="set-count">0</b> sets</span>
    </div>
    <div class="actions">
      <button id="btn-preview">Preview</button>
      <button id="btn-edit" class="edit-only">Edit</button>
      <button id="btn-pdf">Export PDF</button>
      <button id="btn-export" title="Download session as JSON">Export data</button>
      <button id="btn-new">New</button>
    </div>
  </header>

  <main>
    <div id="loading" class="no-print">Loading tune index…</div>

    <section id="editor" class="no-print">
      <div id="sets"></div>
      <button id="add-set" class="add-set-btn">+ Add set</button>
      <p class="hint">
        Type a tune name and pick the matching tune from the list — the type and
        thesession.org link fill in automatically. Use <b>+ Custom tune</b> for
        anything not on thesession (double-click a custom row to set its type and link).
      </p>
    </section>

    <section id="preview" class="print-area"></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
